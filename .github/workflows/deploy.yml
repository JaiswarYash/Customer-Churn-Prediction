name: CI/CD Pipeline
on:
  push:
    branches: main

jobs:
  tests:
    runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: 3.11
    - run: pip install -r requirements.txt
    - run: pytest tests/

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker containers
        run: docker compose build

