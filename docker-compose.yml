version: "3.8"

services:
    api:
        build:
            context: .
            dockerfile: Dockerfile.api
        container_name: churn_api
        ports: 
            - "8000:8000"
        volumes:
            - ./models:/app/models # model updates without rebuild
        environment:
            - MODEL_PATH=models/random_forest_model.pkl
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/"]
            interval: 30s
            timeout: 10s
            retries: 3

    streamlit:
        build:
            context: .
            dockerfile: Dockerfile.streamlit
        container_name: streamlit_application
        ports:
            - "8501:8501"
        depends_on:
            - api  # waits for API to start first
        environment:
            - API_URL=http://api:8000  # use service name, not localhost